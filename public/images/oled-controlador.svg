<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="360" height="330" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Pantalla OLED del controlador</title>
  <desc id="desc">Módulo OLED SH1106 de 1,3 pulgadas, con los pines GND, VCC, SCL y SDA arriba, mostrando la vista Estado: zona 1, señal WiFi, temperatura 24,5 °C, humedad del aire 68 %, suelo 41 %, riego apagado, 3 de 3 nodos y la hora 12:40.</desc>
  <!-- placa -->
  <rect x="4" y="4" width="352" height="322" rx="10" fill="#1d4f9e"/>
  <rect x="10" y="10" width="340" height="310" rx="7" fill="none" stroke="#2f66bd" stroke-width="2"/>
  <!-- agujeros de montaje -->
  <g fill="#c9ccd1" stroke="#8a8f96" stroke-width="2">
    <circle cx="30" cy="30" r="13"/>
    <circle cx="330" cy="30" r="13"/>
    <circle cx="30" cy="300" r="13"/>
    <circle cx="330" cy="300" r="13"/>
  </g>
  <g fill="#1d4f9e">
    <circle cx="30" cy="30" r="7"/>
    <circle cx="330" cy="30" r="7"/>
    <circle cx="30" cy="300" r="7"/>
    <circle cx="330" cy="300" r="7"/>
  </g>
  <!-- pines -->
  <g fill="#d8b24a" stroke="#9c7b22" stroke-width="2">
    <circle cx="135" cy="28" r="8"/>
    <circle cx="165" cy="28" r="8"/>
    <circle cx="195" cy="28" r="8"/>
    <circle cx="225" cy="28" r="8"/>
  </g>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="135" y="56">GND</text>
    <text x="165" y="56">VCC</text>
    <text x="195" y="56">SCL</text>
    <text x="225" y="56">SDA</text>
  </g>
  <!-- vidrio -->
  <rect x="34" y="72" width="292" height="176" rx="4" fill="#0b0d10"/>
  <!-- área activa de 128 × 64 píxeles, escalada x2 -->
  <g fill="#f2f6ff" font-family="'DejaVu Sans Mono', Consolas, 'Courier New', monospace" font-size="19" lengthAdjust="spacingAndGlyphs">
    <text x="52" y="116" textLength="72">Zona 1</text>
    <text x="52" y="148" textLength="96">T 24.5°C</text>
    <text x="212" y="148" textLength="84">HR 68 %</text>
    <text x="52" y="180" textLength="120">Suelo 41 %</text>
    <text x="200" y="180" textLength="108">Riego OFF</text>
    <text x="52" y="212" textLength="108">Nodos 3/3</text>
    <text x="248" y="212" textLength="60">12:40</text>
  </g>
  <g fill="#f2f6ff">
    <rect x="276" y="110" width="8" height="6"/>
    <rect x="286" y="104" width="8" height="12"/>
    <rect x="296" y="98" width="8" height="18"/>
  </g>
  <!-- cinta flexible -->
  <rect x="140" y="248" width="80" height="34" fill="#c58b1c"/>
  <rect x="148" y="252" width="64" height="26" fill="#2b2b2b"/>
</svg>
